<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Infinity Alpha OS</title>

</head>

<body>

    <main class="dashboard">

        <!-- HERO -->

        <section class="hero">

            <div class="hero-content">

                <small class="hero-badge">
                    INFINITY ALPHA OS
                </small>

                <h1 id="greeting">

                    Good Evening, Commander

                </h1>

                <p id="welcomeMessage">

                    Welcome back.
                    Your command center is ready.

                </p>

                <div class="hero-buttons">

                    <button id="startDay">

                        Start Day

                    </button>

                    <button id="focusMode">

                        Focus Mode

                    </button>

                </div>

            </div>

            <div class="hero-orb">

                <div class="orb">

                    A

                </div>

            </div>

        </section>

        <!-- DASHBOARD GRID -->

        <section class="dashboard-grid">

            <div class="card">

                Weather

            </div>

            <div class="card">

                Wealth OS

            </div>

            <div class="card">

                Markets

            </div>

            <div class="card">

                Productivity

            </div>

        </section>

    </main>

</body>

</html>
